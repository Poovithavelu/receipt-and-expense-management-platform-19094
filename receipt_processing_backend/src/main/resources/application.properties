spring.application.name=receiptprocessingbackend

# MongoDB configuration via environment variables (must be set in container environment)
# We use placeholders with defaults for local convenience; override via env in production.
MONGODB_URL=${MONGODB_URL:mongodb://localhost:27017}
MONGODB_DB=${MONGODB_DB:receipt_app}

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
