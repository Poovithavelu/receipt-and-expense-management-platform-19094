spring.application.name=receiptprocessingbackend

# MongoDB Configuration
# Uses environment variables with sensible fallbacks for local development.
# - spring.data.mongodb.uri: full Mongo connection string (includes credentials/host/params)
# - spring.data.mongodb.database: database name to use
spring.data.mongodb.uri=${MONGODB_URL:mongodb://appuser:dbuser123@localhost:5000/?authSource=admin}
spring.data.mongodb.database=${MONGODB_DB:myapp}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
