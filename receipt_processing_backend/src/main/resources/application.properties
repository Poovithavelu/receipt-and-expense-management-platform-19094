spring.application.name=receiptprocessingbackend

# MongoDB configuration via environment variables (must be set in container environment)
# MONGODB_URL: e.g., mongodb://user:pass@host:port
# MONGODB_DB: database name
# Accessed in MongoConfig using @Value("${MONGODB_URL}") and @Value("${MONGODB_DB}")

# Logging
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=INFO

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
